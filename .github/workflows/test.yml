name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Bare minors resolve to the LATEST patch, all on one side of the two stdlib
        # boundaries the guard pins (MYC-4719). The exact entries put one job on
        # EACH side of each boundary, from the actions/python-versions manifest:
        #   CVE-2024-4032 backport (2002::/16 becomes is_private):  3.10.14 | 3.10.15, 3.12.3 | 3.12.4+
        #   Dec-2024 mapped short-circuit (is_reserved for ::ffff:): 3.10.15 | 3.10.16, 3.12.7 | 3.12.8, 3.13.0 | 3.13.1
        # Drop an exact entry only when the manifest no longer carries it.
        python-version: ["3.10.14", "3.10.15", "3.10", "3.11", "3.12.3", "3.12.7", "3.12", "3.13.0", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CI gate (canonical — mirrors local ci-test `make ci`)
        run: make ci
